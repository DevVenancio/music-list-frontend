<div class="container mx-auto">
  <h2 class="text-2xl font-semibold leading-7 text-gray-900 text-center">Listagem de Playlist</h2>

  <div class="flex justify-between my-4">
    <!-- Botão para adicionar nova música -->
    <div class="flex justify-center my-4">
      <button class="flex flex-row items-center gap-1 w-fit h-fit mx-2 bg-green-600 text-white font-medium p-2 rounded-md hover:bg-green-700" (click)="addNewPlaylist()">
        <svg lucidePlus class="size-5"></svg>
        Adicionar Nova Playlist
      </button>
    </div>
  </div>
  
  <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-2">
    @for (playlist of playlistList; track playlist._id) {
      <mat-card class="flex flex-col items-center h-full w-80 shadow-custom transition-all duration-300 ease-in-out hover:scale-[1.02]" appearance="outlined">
      <mat-card-header class="flex flex-col gap-2">
        <div mat-card-image>
          <img class="h-44 w-44 rounded-2xl" [src]="playlist.imgPlaylist" alt="">
        </div>
        <div class="flex flex-col items-center mb-1 p-1">
          <mat-card-title>{{ playlist.name }}</mat-card-title>
        </div>
      </mat-card-header>
      <mat-card-content>
          <div class="flex flex-col items-center mb-3 ">
            <strong class="self-center">Número de Músicas:</strong> {{playlist.amountSongs}}
          </div>
      </mat-card-content>
      <mat-card-actions class="justify-between gap-4">
        <button mat-button class="bg-slate-500 text-white p-2 rounded-md hover:bg-slate-600" (click)="viewPlaylistDetails(playlist._id)">
          <svg lucideInfo class="size-5"></svg>
        </button>
        <button mat-button class="bg-red-500 text-white p-2 rounded-md hover:bg-red-600" (click)="confirmPlaylistDelete(playlist._id)" >
          <svg lucideTrash class="size-5"></svg>
        </button>
      </mat-card-actions>
    </mat-card>
    }
  </div>
</div>
<router-outlet></router-outlet>
